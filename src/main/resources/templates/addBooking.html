<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Add Booking</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Add New Booking</h2>

<form th:action="@{/save}" th:object="${booking}" method="post">

<input type="text" class="form-control mb-3" placeholder="Passenger Name"
th:field="*{passengerName}">

<input type="email" class="form-control mb-3"
placeholder="Email"
th:field="*{email}">

<input type="text"
class="form-control mb-3"
placeholder="Phone"
th:field="*{phoneNumber}">

<input type="text"
class="form-control mb-3"
placeholder="Source"
th:field="*{source}">

<input type="text"
class="form-control mb-3"
placeholder="Destination"
th:field="*{destination}">

<input type="date"
class="form-control mb-3"
th:field="*{travelDate}">

<input type="number"
class="form-control mb-3"
placeholder="Passengers"
th:field="*{numberOfPassengers}">

<input type="number"
step="0.01"
class="form-control mb-3"
placeholder="Ticket Price"
th:field="*{ticketPrice}">

<button class="btn btn-primary">

Save Booking

</button>

<a href="/bookings" class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>
</html>
