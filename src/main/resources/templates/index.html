<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Travel Booking Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="/">Travel Booking System</a>

<a href="/add" class="btn btn-warning">
Add Booking
</a>

</div>

</nav>

<div class="container mt-4">

<h2 class="text-center mb-4">
Travel Booking Dashboard
</h2>

<table class="table table-bordered table-striped table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Source</th>

<th>Destination</th>

<th>Date</th>

<th>Passengers</th>

<th>Price</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="booking : ${bookings}">

<td th:text="${booking.bookingId}"></td>

<td th:text="${booking.passengerName}"></td>

<td th:text="${booking.email}"></td>

<td th:text="${booking.phoneNumber}"></td>

<td th:text="${booking.source}"></td>

<td th:text="${booking.destination}"></td>

<td th:text="${booking.travelDate}"></td>

<td th:text="${booking.numberOfPassengers}"></td>

<td th:text="${booking.ticketPrice}"></td>

<td>

<a th:href="@{/edit/{id}(id=${booking.bookingId})}"
class="btn btn-success btn-sm">

Edit

</a>

<a th:href="@{/delete/{id}(id=${booking.bookingId})}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
